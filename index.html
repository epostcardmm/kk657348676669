<!DOCTYPE html>
<html lang="my" style="--bg-gradient: linear-gradient(135deg, #654ea3 0%, #eaafc8 100%); --card-bg: rgba(255, 255, 255, 0.12); --card-border: rgba(255, 255, 255, 0.3); --text-color: #fff0f5; --btn-primary: #8a2be2; --btn-secondary: #4a00e0;"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ex Lover - ePostcard &amp; Telegram Delivery</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&amp;family=Poppins:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Padauk', 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --bg-gradient: linear-gradient(135deg, #ffeef8, #d6eaff);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(255, 105, 180, 0.2);
            --text-color: #ff4757;
            --btn-primary: #00bab7;
            --btn-secondary: #00bab7;
        }

        html {
            overflow-y: scroll;
            scrollbar-gutter: stable;
        }

        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: var(--bg-gradient); 
            overflow-x: hidden; 
            position: relative; 
            padding: 70px 14px 110px 14px; 
            transition: background 0.5s ease; 
        }
        
        #heartsContainer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        
        .bg-heart { 
            position: absolute; 
            color: rgba(255, 105, 180, 0.2); 
            font-size: 20px; 
            animation: floatUp 6s linear infinite; 
            bottom: -30px; 
            z-index: 0; 
            pointer-events: none; 
        }
        @keyframes floatUp { 
            0% { transform: translateY(0) rotate(0deg); opacity: 1; } 
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; } 
        }
        
        .top-bar-left {
            position: fixed; top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 6px 10px; border-radius: 26px;
            display: flex; gap: 7px; z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            align-items: center; max-width: calc(100% - 20px);
            flex-wrap: wrap;
        }

        .theme-btn {
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid white; cursor: pointer;
            transition: 0.2s; flex-shrink: 0;
        }
        .theme-btn:hover { transform: scale(1.2); }

        .guide-top-btn {
            background: #e0f2fe; border: 1.5px solid #bae6fd;
            color: #0284c7; padding: 3px 8px; border-radius: 16px;
            font-size: 10px; font-weight: 700; cursor: pointer;
            transition: 0.2s; white-space: nowrap;
        }
        .guide-top-btn:hover { background: #bae6fd; }

        .card-container { 
            position: relative; 
            width: 90%; 
            max-width: 400px; 
            min-height: 380px;
            background: var(--card-bg); 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            padding: 30px 22px; 
            text-align: center; 
            z-index: 10; 
            border: 2px solid var(--card-border); 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .gif-container { 
            width: 150px; 
            height: 150px; 
            margin: 15px auto; 
            cursor: pointer; 
            position: relative; 
            flex-shrink: 0;
        }
        .gif-container img { 
            width: 100%; 
            height: 100%; 
            border-radius: 15px; 
            object-fit: cover; 
            display: block;
        }
        
        .editable-wrap { 
            position: relative; 
            display: block; 
            width: 100%; 
            margin-bottom: 12px; 
        }

        .edit-badge {
            position: absolute; 
            top: -10px; 
            right: -10px;
            background: #ff4081; 
            color: white; 
            font-size: 13px;
            width: 28px; 
            height: 28px; 
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            cursor: pointer; 
            z-index: 30; 
            border: 2px solid white;
            transition: background 0.2s ease;
        }
        .edit-badge:hover { background: #f50057; }

        [contenteditable="true"] {
            outline: 2px dashed #ff80ab; 
            outline-offset: 4px;
            border-radius: 8px; 
            background: rgba(255, 255, 255, 0.4);
            cursor: text;
        }

        .btn-group { 
            position: relative; 
            min-height: 80px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            flex-wrap: wrap; 
            width: 100%;
        }
        
        .btn-editable-wrap {
            position: relative;
            display: inline-block;
        }

        button.interactive-btn { 
            padding: 12px 25px; 
            font-weight: bold; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: background 0.2s ease, transform 0.2s ease; 
            font-size: 16px; 
            outline: none; 
            display: inline-block;
        }
        
        .primary-btn { background: var(--btn-primary); color: white; }
        .secondary-btn { background: var(--btn-secondary); color: white; }

        .fullscreen-active { 
            position: fixed !important; 
            top: 0; left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 9999; 
            border-radius: 0; 
            font-size: 30px; 
        }
        
        #captureArea {
            background: linear-gradient(135deg, #fff, #fff0f5);
            border: 2px dashed #85ff75;
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            width: 100%;
        }
        #captureArea h3 {
            color: #ff4757;
            margin-bottom: 12px;
            font-size: 18px;
        }
        .result-item {
            background: #ffffff;
            border: 1px solid #cfffcc;
            border-radius: 12px;
            padding: 10px 12px;
            margin: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            box-shadow: 0 3px 8px rgba(255, 117, 140, 0.08);
            gap: 4px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }
        .result-q {
            font-size: 13px;
            color: #444;
            flex: 1;
            padding-right: 8px;
            font-weight: 500;
        }
        .result-a {
            background: #00bab7;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }
        .result-no-count {
            font-size: 11px;
            color: #ff4757;
            font-weight: bold;
        }

        #successScreen {
            justify-content: flex-start;
            padding: 16px 14px;
            min-height: auto;
        }
        #successScreen #captureArea {
            padding: 12px;
        }
        #successScreen #captureArea h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }
        #successScreen .result-item {
            padding: 7px 10px;
            margin: 6px 0;
            gap: 2px;
        }
        #successScreen .result-q {
            font-size: 12px;
        }
        #successScreen .result-a {
            padding: 4px 10px;
            font-size: 11px;
        }
        #successScreen .result-no-count {
            font-size: 10px;
        }
        #successScreen button.interactive-btn {
            margin-top: 12px !important;
            padding: 10px !important;
            font-size: 14px !important;
        }
        
        #sendingStatus { display: none; font-size: 14px; color: #6c5ce7; margin-top: 10px; font-weight: bold; }
        
        .heart-start-btn { 
            cursor: pointer; 
            margin: 15px auto; 
            display: inline-block; 
            user-select: none; 
        }
        .heart-start-btn img { width: 140px; height: auto; display: block; border: none; outline: none; background: transparent; }

        .burst-emoji {
            position: fixed;
            font-size: 26px;
            pointer-events: none;
            z-index: 99999;
            animation: burstAnim 0.8s ease-out forwards;
        }
        @keyframes burstAnim {
            0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; }
        }

        .bottom-bar {
            position: fixed; bottom: 12px; left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 15, 30, 0.9);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 8px 10px; border-radius: 22px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
            z-index: 1000; display: flex; flex-wrap: wrap;
            justify-content: center; gap: 6px; align-items: center;
            border: 1px solid rgba(255, 128, 171, 0.3);
            width: calc(100% - 24px); max-width: 560px;
        }

        .formspree-input {
            padding: 6px 10px; border: 1px solid #ff80ab;
            border-radius: 18px; font-size: 11px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff; outline: none;
            flex: 1 1 120px; min-width: 100px;
        }
        .formspree-input::placeholder { color: rgba(255,255,255,0.5); }

        .control-action-btn {
            background: #5c1d33; color: white;
            border: none; padding: 7px 10px;
            border-radius: 18px; font-weight: bold;
            font-size: 11px; cursor: pointer;
            transition: 0.2s; white-space: nowrap;
            flex: 0 0 auto;
        }
        .control-action-btn:hover { transform: scale(1.05); }

        .btn-preview-mode { background: linear-gradient(135deg, #00b09b, #96c93d); }
        .btn-telegram-mode { background: linear-gradient(135deg, #3b82f6, #2563eb); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center;
            z-index: 2000; padding: 12px;
        }
        .modal-content {
            background: #ffffff; border: 2px solid #3b82f6;
            padding: 18px; border-radius: 20px;
            max-width: 420px; width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-height: 88vh; overflow-y: auto;
            color: #1e293b; text-align: left;
            scrollbar-gutter: stable;
        }
        .modal-content.dark {
            background: #2a1b2a; border-color: #ff80ab; color: #fff;
        }
        .modal-content h3 {
            color: #0369a1; margin-bottom: 12px;
            font-size: 15px; font-weight: 700;
            text-align: center; border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 8px;
        }
        .dark .modal-content h3 {
            color: #ff80ab; border-bottom-color: #ff80ab;
        }

        .guide-step {
            display: flex; gap: 8px; align-items: flex-start;
            margin-bottom: 10px; font-size: 13px; line-height: 1.5;
        }
        .guide-step-num {
            background: #e0f2fe; color: #0284c7; font-weight: 700;
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 11px; margin-top: 2px;
        }
        .dark .guide-step-num { background: rgba(255,128,171,0.2); color: #ff80ab; }

        .payment-section {
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border: 1.5px solid #fde68a; border-radius: 16px;
            padding: 12px; margin-bottom: 12px;
        }
        .payment-section h5 {
            color: #b45309; font-size: 12px; font-weight: 700;
            margin-bottom: 8px; border-bottom: 1px dashed #fcd34d;
            padding-bottom: 4px;
        }
        .pay-row {
            display: flex; justify-content: space-between;
            align-items: center; gap: 6px; padding: 5px 8px;
            background: #ffffff; border: 1px solid #fef3c7;
            border-radius: 8px; margin-bottom: 4px; flex-wrap: wrap;
        }
        .pay-label { font-size: 10px; font-weight: 700; color: #92400e; }
        .pay-value {
            font-size: 11px; font-weight: 600; color: #1e293b;
            text-align: right; word-break: break-all;
            flex: 1; min-width: 0;
        }
        .pay-copy-btn {
            background: #fef3c7; border: 1px solid #fcd34d;
            color: #b45309; border-radius: 6px;
            padding: 3px 6px; font-size: 10px;
            font-weight: 700; cursor: pointer; flex-shrink: 0;
        }
        .pay-price-row {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            border-color: #fecaca;
        }
        .pay-price-row .pay-label { color: #b91c1c; }
        .pay-price-row .pay-value { color: #dc2626; font-weight: 800; font-size: 12px; }

        .payment-upload-box {
            background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
            border: 1.5px dashed #34d399; border-radius: 16px;
            padding: 12px; margin-bottom: 12px;
        }
        .payment-upload-box label {
            color: #047857 !important; font-size: 11px !important;
            display: block; margin-bottom: 6px; font-weight: 700;
        }
        .payment-upload-box input[type="file"] {
            width: 100%; background: #ffffff;
            border: 1px solid #a7f3d0; padding: 8px;
            border-radius: 10px; font-size: 12px; cursor: pointer;
        }
        .image-preview-container {
            margin-top: 8px; display: none; text-align: center;
            border-radius: 10px; overflow: hidden;
            border: 1px solid #10b981; max-height: 140px;
            background: #fff; padding: 4px;
        }
        .image-preview-container img {
            width: 100%; max-height: 130px; object-fit: contain;
        }

        .form-group { margin-bottom: 10px; }
        .form-group label {
            display: block; font-size: 11px; font-weight: 700;
            color: #64748b; margin-bottom: 4px;
        }
        .form-group input {
            width: 100%; padding: 10px 14px;
            background: #f9fbfd; border: 1.5px solid #e2e8f0;
            border-radius: 12px; font-size: 13px;
            color: #0f172a; outline: none;
        }

        .loading-overlay {
            display: none; position: absolute; inset: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(3px); z-index: 3000;
            border-radius: 20px; flex-direction: column;
            justify-content: center; align-items: center; gap: 10px;
        }
        .loading-spinner {
            width: 36px; height: 36px;
            border: 4px solid #e2e8f0; border-top: 4px solid #2563eb;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 13px; font-weight: 700; color: #2563eb; }

        .thankyou-section { display: none; text-align: center; padding: 10px 0; }
        .thankyou-section.show { display: block; }
        .thankyou-badge {
            width: 50px; height: 50px; margin: 0 auto 10px auto;
            border-radius: 50%; background: #10b981;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: white;
        }
        .contact-copy-row {
            display: flex; justify-content: space-between;
            align-items: center; gap: 6px; padding: 8px 10px;
            background: #f0fdf4; border: 1px solid #bbf7d0;
            border-radius: 10px; margin-bottom: 6px; flex-wrap: wrap;
        }
        .cc-label { font-size: 10px; font-weight: 700; color: #047857; }
        .cc-value {
            font-size: 12px; font-weight: 700; color: #065f46;
            word-break: break-all; flex: 1; min-width: 0;
        }
        .cc-copy-btn {
            background: #dcfce7; border: 1px solid #bbf7d0;
            color: #047857; border-radius: 6px;
            padding: 4px 8px; font-size: 10px;
            font-weight: 700; cursor: pointer; flex-shrink: 0;
        }

        body.preview-active .edit-badge,
        body.preview-active .top-bar-left,
        body.preview-active .formspree-input {
            display: none !important;
        }

        body.modal-open {
            overflow: hidden;
        }
    </style>
</head>
<body class="modal-open">

    

    

    <div id="heartsContainer"></div>

    <!-- Intro Screen -->
    <div class="card-container" id="introScreen" style="display: flex;">
        <div class="editable-wrap">
            <h2 id="introTitle" style="color: var(--text-color); margin-bottom: 10px;" onclick="enableEdit('introTitle', event)">Hello ပိုင်</h2>
            
        </div>
        <div class="editable-wrap">
            <p id="introSub" style="color: #555; font-size: 14px; margin-bottom: 5px;" onclick="enableEdit('introSub', event)">Click The Heart</p>
            
        </div>
        <div class="heart-start-btn" id="startHeartBtn">
            <img src="https://media.tenor.com/u2FhRqMVu3MAAAAi/heart-white.gif" alt="Heart GIF">
        </div>
    </div>

    <!-- Main Card (Multi-step) -->
    <div class="card-container" id="mainCard" style="display: none;">
        <div class="editable-wrap">
            <h2 id="questionText" style="color: var(--text-color);">ပြန်ချစ်ကြည့်ကြမလား?</h2>
            
        </div>
        
        <div class="gif-container" onclick="triggerImageUpload('step')">
            <img id="statusGif" src="https://media.tenor.com/NbfYAAyKtmkAAAAi/bubu-dudu-sad.gif">
            
        </div>

        <div class="btn-group" id="btnGroup" style="display: flex;">
            <div class="btn-editable-wrap">
                <button id="yesBtn" class="interactive-btn primary-btn" onclick="handleInteraction(true)" style="transform: scale(1);">ချစ်တယ်</button>
                
            </div>
            <div class="btn-editable-wrap">
                <button id="noBtn" class="interactive-btn secondary-btn" onclick="handleNoClick()" style="transform: scale(1); opacity: 1; position: static; left: auto; top: auto;">မချစ်ဘူး</button>
                
            </div>
        </div>
        <div id="sendingStatus" style="display: none;">အဖြေများကို ပို့ပေးနေပါသည်... 💌</div>
    </div>

    <!-- Success Screen -->
    <div class="card-container" id="successScreen" style="display: none;">
        <div id="captureArea">
            <h3>💖 Our Love Agreement</h3>
            <div id="summaryList"></div>
        </div>
        <button class="primary-btn interactive-btn" style="width:100%;" onclick="saveToPNG()">Save As PNG 📸</button>
    </div>

    <!-- Bottom Bar -->
    

    <!-- Modals -->
    

    

    <script>
        let FORMSPREE_URL = ""; 
        let isPreviewOnly = false;
        let currentIntroTitle = "Hello ရည်းစားဟောင်းလေး";
        let currentIntroSub = "Click The Heart";

        let steps = [
            { question: "ပြန်ချစ်ကြည့်ကြမလား?", yes: "ချစ်တယ်", no: "မချစ်ဘူး", gif: "https://media.tenor.com/NbfYAAyKtmkAAAAi/bubu-dudu-sad.gif", type: "shrink" },
            { question: "သတိရနေခဲ့တာ သိရဲ့လား", yes: "ဒီကရောပဲ", no: "မယုံပါဘူး", gif: "https://media.tenor.com/WRRnrnJBMWMAAAAi/bubu-miss-dudu-bubu-cry.gif", type: "run" },
            { question: "ပြန်တွဲကြမယ်လေနော် နော်..", yes: "တွဲကြမယ်", no: "တော်ပါပြီ", gif: "https://media.tenor.com/Zc42xR3zFWYAAAAi/bubu-dudu-sseeyall.gif", type: "fade" },
            { question: "ပြန်လာမယ်မလား", yes: "ပြန်လာမယ်", no: "မလာပါဘူး", gif: "https://media.tenor.com/p6T6kEvc-IMAAAAi/cry-phone.gif", type: "fullscreen" },
            { question: "ဒါဆို ရည်းစားပြန်ဖြစ်ပြီနော်..ဟဲဟဲ", yes: "Yes,Of Course", no: "No..No..No", gif: "https://media.tenor.com/HUJyzO0WfM4AAAAi/bubu-dudu.gif", type: "magnet" }
        ];

        let currentStep = 0, yesScale = 1, noScale = 1, userAnswers = [];
        let noClickCounts = [0, 0, 0, 0, 0];

        const themes = [
            { bg: "linear-gradient(135deg, #ffeef8, #d6eaff)", cardBg: "rgba(255, 255, 255, 0.9)", cardBorder: "rgba(255, 105, 180, 0.2)", textColor: "#ff4757", btnPrimary: "#00bab7", btnSecondary: "#00bab7" },
            { bg: "linear-gradient(135deg, #2c1626 0%, #4a1525 50%, #1f1c2c 100%)", cardBg: "rgba(255, 255, 255, 0.08)", cardBorder: "rgba(255, 192, 203, 0.2)", textColor: "#ff80ab", btnPrimary: "#e91e63", btnSecondary: "#5c1d33" },
            { bg: "linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%)", cardBg: "rgba(255, 255, 255, 0.85)", cardBorder: "rgba(255, 255, 255, 0.6)", textColor: "#d81b60", btnPrimary: "#11998e", btnSecondary: "#ff416c" },
            { bg: "linear-gradient(135deg, #654ea3 0%, #eaafc8 100%)", cardBg: "rgba(255, 255, 255, 0.12)", cardBorder: "rgba(255, 255, 255, 0.3)", textColor: "#fff0f5", btnPrimary: "#8a2be2", btnSecondary: "#4a00e0" },
            { bg: "linear-gradient(135deg, #0c3483 0%, #a2b6df 100%)", cardBg: "rgba(255, 255, 255, 0.1)", cardBorder: "rgba(255, 255, 255, 0.3)", textColor: "#e3f2fd", btnPrimary: "#00c6ff", btnSecondary: "#192841" }
        ];

        function setTheme(index) {
            const t = themes[index];
            const r = document.documentElement;
            r.style.setProperty('--bg-gradient', t.bg);
            r.style.setProperty('--card-bg', t.cardBg);
            r.style.setProperty('--card-border', t.cardBorder);
            r.style.setProperty('--text-color', t.textColor);
            r.style.setProperty('--btn-primary', t.btnPrimary);
            r.style.setProperty('--btn-secondary', t.btnSecondary);
        }

        function updateFormspree(input) {
            FORMSPREE_URL = input.value.trim();
        }

        function togglePreview() {
            resetApp();
            isPreviewOnly = !isPreviewOnly;
            const btn = document.getElementById('previewBtn');

            if (isPreviewOnly) {
                document.body.classList.add('preview-active');
                btn.innerText = "✏️ Edit";
                btn.classList.remove('btn-preview-mode');
                document.querySelectorAll('[contenteditable="true"]').forEach(el => {
                    el.setAttribute('contenteditable', 'false');
                });
            } else {
                document.body.classList.remove('preview-active');
                btn.innerText = "👁️ Preview";
                btn.classList.add('btn-preview-mode');
            }
        }

        function openGuideModal() { 
            document.getElementById('guideModal').style.display = 'flex'; 
            document.body.classList.add('modal-open');
        }
        function closeGuideModal() { 
            document.getElementById('guideModal').style.display = 'none'; 
            document.body.classList.remove('modal-open');
        }

        /* ✅ To Admin နှိပ်လိုက်ရင် အစက (reset) ပါ အလိုအလျောက် နှိပ်ပြီးသား ဖြစ်စေရန် */
        function openTelegramModal() { 
            resetApp();  // app ကို အစပြန်ထားသည်
            document.getElementById('telegramModal').style.display = 'flex'; 
            document.body.classList.add('modal-open');
        }
        function closeTelegramModal() { 
            document.getElementById('telegramModal').style.display = 'none'; 
            document.body.classList.remove('modal-open');
        }

        function triggerImageUpload(type) {
            if(isPreviewOnly) return;
            window.activeImgType = type;
            document.getElementById('hiddenFileInput').click();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (window.activeImgType === 'step') {
                        steps[currentStep].gif = e.target.result;
                        document.getElementById('statusGif').src = e.target.result;
                    }
                }
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        }

        function enableEdit(id, event) {
            if (event) { event.stopPropagation(); event.preventDefault(); }
            if (isPreviewOnly) return;
            const el = document.getElementById(id);
            if (!el) return;
            
            const isEditable = el.getAttribute('contenteditable') === 'true';
            if (!isEditable) {
                el.setAttribute('contenteditable', 'true');
                el.focus();
                el.onblur = function() {
                    el.setAttribute('contenteditable', 'false');
                    if (id === 'introTitle') currentIntroTitle = el.innerText;
                    if (id === 'introSub') currentIntroSub = el.innerText;
                    if (id === 'questionText') steps[currentStep].question = el.innerText;
                    if (id === 'yesBtn') steps[currentStep].yes = el.innerText;
                    if (id === 'noBtn') steps[currentStep].no = el.innerText;
                };
            } else {
                el.setAttribute('contenteditable', 'false');
            }
        }

        document.getElementById('startHeartBtn').onclick = function(e) {
            const rect = this.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            const emojis = ['❤️', '💖', '💕', '💘', '💓', '💗', '💞'];
            
            for (let i = 0; i < 22; i++) {
                let emojiEl = document.createElement('div');
                emojiEl.className = 'burst-emoji';
                emojiEl.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                let angle = Math.random() * Math.PI * 2;
                let distance = 70 + Math.random() * 110;
                let destX = Math.cos(angle) * distance;
                let destY = Math.sin(angle) * distance;
                
                emojiEl.style.left = `${x}px`;
                emojiEl.style.top = `${y}px`;
                emojiEl.style.setProperty('--dx', `${destX}px`);
                emojiEl.style.setProperty('--dy', `${destY}px`);
                
                document.body.appendChild(emojiEl);
                setTimeout(() => emojiEl.remove(), 800);
            }

            setTimeout(() => {
                document.getElementById('introScreen').style.display = 'none';
                document.getElementById('mainCard').style.display = 'flex';
            }, 350);
        };

        function handleInteraction(isYes) {
            nextStep(isYes);
        }

        function nextStep(isYes) {
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.classList.remove('fullscreen-active');
            
            userAnswers.push({ 
                q: steps[currentStep].question, 
                a: isYes ? steps[currentStep].yes : steps[currentStep].no,
                noCount: noClickCounts[currentStep] 
            });
            
            currentStep++;
            if (currentStep < steps.length) {
                updateCard();
            } else {
                sendAnswersToFormspree();
            }
        }

        function handleNoClick() {
            noClickCounts[currentStep]++; 
            
            const step = steps[currentStep];
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            if (step.type === "shrink") { 
                yesScale += 0.3; yesBtn.style.transform = `scale(${yesScale})`; 
                noScale -= 0.2; noBtn.style.transform = `scale(${noScale})`; 
            }
            else if (step.type === "fade") noBtn.style.opacity = '0';
            else if (step.type === "fullscreen") yesBtn.classList.add('fullscreen-active');
            else if (step.type === "magnet") { 
                noBtn.style.opacity = '0';
                yesBtn.style.transform = 'scale(1.5)';
                setTimeout(() => nextStep(true), 300);
            } else if (step.type === "run") {
                dodgeButton();
            }
        }

        function dodgeButton() {
            const noBtn = document.getElementById('noBtn');
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.zIndex = '1000';
            noBtn.style.left = '0';
            noBtn.style.top = '0';
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        document.getElementById('noBtn').onclick = (e) => {
            handleNoClick();
        };

        function updateCard() {
            const s = steps[currentStep];
            const noBtn = document.getElementById('noBtn');

            document.getElementById('questionText').innerText = s.question;
            document.getElementById('yesBtn').innerText = s.yes; 
            noBtn.innerText = s.no;
            document.getElementById('statusGif').src = s.gif;
            
            document.getElementById('yesBtn').style.transform = "scale(1)"; 
            noScale = 1; 
            noBtn.style.transform = "scale(1)"; 
            noBtn.style.opacity = "1"; 
            noBtn.style.position = 'static';
            noBtn.style.left = 'auto';
            noBtn.style.top = 'auto';
        }

        function sendAnswersToFormspree() {
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('sendingStatus').style.display = 'block';

            let formData = {};
            userAnswers.forEach((item, index) => {
                formData[`မေးခွန်း ${index + 1}: ${item.q}`] = `${item.a} (ငြင်းခဲ့သည့်အကြိမ်ရေ: ${item.noCount} ကြိမ်)`;
            });

            if (FORMSPREE_URL) {
                fetch(FORMSPREE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify(formData)
                }).then(() => showResult()).catch(() => showResult());
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('successScreen').style.display = 'flex';
            document.getElementById('summaryList').innerHTML = userAnswers.map((item, i) => 
                `<div class="result-item">
                    <div class="result-row">
                        <span class="result-q">${i+1}. ${item.q}</span>
                        <span class="result-a">${item.a}</span>
                    </div>
                    <div class="result-no-count">❌ ငြင်းခဲ့သည့်အကြိမ်ရေ: ${item.noCount} ကြိမ်</div>
                </div>`
            ).join('');
        }

        function saveToPNG() {
            html2canvas(document.getElementById('captureArea')).then(canvas => {
                let link = document.createElement('a');
                link.download = 'Our_Love_Agreement.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function resetApp() {
            currentStep = 0;
            yesScale = 1;
            noScale = 1;
            userAnswers = [];
            noClickCounts = [0, 0, 0, 0, 0];
            isPreviewOnly = false;
            document.body.classList.remove('preview-active');
            
            const previewBtn = document.getElementById('previewBtn');
            if (previewBtn) { previewBtn.innerText = "👁️ Preview"; previewBtn.classList.add('btn-preview-mode'); }

            document.getElementById('successScreen').style.display = 'none';
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('introScreen').style.display = 'flex';
            document.getElementById('btnGroup').style.display = 'flex';
            document.getElementById('sendingStatus').style.display = 'none';
            updateCard();
        }

        function copyValue(btn) {
            const val = btn.getAttribute('data-copy');
            const originalHTML = btn.innerHTML;
            const doCopy = () => {
                btn.innerHTML = '✅ Copied';
                setTimeout(() => { btn.innerHTML = originalHTML; }, 1400);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(val).then(doCopy).catch(() => doCopy());
            } else {
                doCopy();
            }
        }

        function handleFormChange() {
            const imageInput = document.getElementById('telegramImageFile');
            const fileNameInput = document.getElementById('telegramHtmlFileName');
            const sendBtn = document.getElementById('sendBtn');
            const previewContainer = document.getElementById('imagePreviewContainer');
            const previewImg = document.getElementById('imagePreview');

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewContainer.style.display = 'block';
                }
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                previewImg.src = '';
                previewContainer.style.display = 'none';
            }

            const hasImage = imageInput.files && imageInput.files.length > 0;
            const hasFileName = fileNameInput.value.trim() !== "";
            sendBtn.disabled = !(hasImage && hasFileName);
        }

        async function sendToTelegramBot() {
            const botToken = "8883736685:AAFOMls5VSwNkasnlkjKp4Uhd3P03Yxx-Po";
            const chatId = "8113541021";

            const imageInput = document.getElementById('telegramImageFile');
            const fileNameInput = document.getElementById('telegramHtmlFileName');
            const loadingOverlay = document.getElementById('loadingOverlay');

            let htmlFileName = fileNameInput.value.trim();
            if (!htmlFileName.endsWith('.html')) htmlFileName += '.html';

            loadingOverlay.style.display = 'flex';

            try {
                const imageFile = imageInput.files[0];
                const photoFormData = new FormData();
                photoFormData.append('chat_id', chatId);
                photoFormData.append('photo', imageFile);
                photoFormData.append('caption', `📷 Payment Screenshot for: ${htmlFileName}`);

                const photoResponse = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                    method: 'POST',
                    body: photoFormData
                });

                if (!photoResponse.ok) throw new Error("ငွေလွှဲပြေစာ ပို့မရပါ။");

                const cloneDoc = document.documentElement.cloneNode(true);
                cloneDoc.querySelectorAll('.edit-badge').forEach(el => el.remove());
                cloneDoc.querySelectorAll('.top-bar-left').forEach(el => el.remove());
                cloneDoc.querySelectorAll('.bottom-bar').forEach(el => el.remove());
                cloneDoc.querySelectorAll('.modal-overlay').forEach(el => el.remove());
                cloneDoc.querySelectorAll('#hiddenFileInput').forEach(el => el.remove());
                cloneDoc.querySelectorAll('.bg-heart').forEach(el => el.remove());
                cloneDoc.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));

                const cleanHtmlContent = "<!DOCTYPE html>\n" + cloneDoc.outerHTML;
                const htmlBlob = new Blob([cleanHtmlContent], { type: 'text/html' });

                const docFormData = new FormData();
                docFormData.append('chat_id', chatId);
                docFormData.append('document', htmlBlob, htmlFileName);
                docFormData.append('caption', `📄 Customized File0009 HTML: ${htmlFileName}`);

                const docResponse = await fetch(`https://api.telegram.org/bot${botToken}/sendDocument`, {
                    method: 'POST',
                    body: docFormData
                });

                if (!docResponse.ok) throw new Error("HTML File ပို့မရပါ။");

                loadingOverlay.style.display = 'none';
                document.getElementById('telegramFormBlock').style.display = 'none';
                document.getElementById('thankyouSection').classList.add('show');

            } catch (error) {
                loadingOverlay.style.display = 'none';
                alert("❌ အမှားအယွင်းရှိသည်: " + error.message);
            }
        }

        setInterval(() => {
            let h = document.createElement('div');
            h.className = 'bg-heart';
            h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            document.getElementById('heartsContainer').appendChild(h);
            setTimeout(() => h.remove(), 6000);
        }, 800);
    </script>
